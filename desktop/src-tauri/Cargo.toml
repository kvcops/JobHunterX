[package]
name = "jobhunterx-desktop"
version = "2.0.0"
description = "JobHunterX desktop app"
edition = "2021"
publish = false

[lib]
name = "jobhunterx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2.14", optional = true }
url = "2"
serde_json = "1"

[features]
# Release builds from CI turn this on (they are signed for the updater); local builds leave it off.
updater = ["dep:tauri-plugin-updater"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
