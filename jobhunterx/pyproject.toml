[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunterx"
version = "0.1.0"
description = "Career Intelligence & Application Agent — local-first, AI-powered"
requires-python = ">=3.11"
dependencies = [
    # --- Web Framework & Networking ---
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "httpx>=0.27.0",

    # --- Data & Config ---
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "python-dotenv>=1.1.0",
    "langgraph>=1.2.9",

    # --- LLM Provider & Router ---
    "litellm==1.80.0",
    "google-genai>=1.65.0",

    # --- Search & Scraping ---
    "ddgs>=9.0.0",
    "curl-cffi>=0.15.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.13.0",
    "lxml>=5.4.0",
    "scrapegraphai>=1.0.0",

    # --- PDF & Extraction ---
    "xhtml2pdf>=0.2.0",
    "jinja2>=3.1.0",
    "pymupdf>=1.25.0",

    # --- Persistence ---
    "aiosqlite>=0.22.0",

    # --- Resilience & Caching ---
    "tenacity>=9.1.0",
    "diskcache>=5.6.0",

    # --- Observability & System ---
    "structlog>=26.1.0",
    "psutil>=7.0.0",

    # --- Browser Automation ---
    "browser-use[core]>=0.13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vellum*"]
