<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="jhx-fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="jhx-fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="120" height="120" rx="28" fill="#090d16"/>

  <!-- Glowing Diamond Frame -->
  <path d="M 60,12 L 106,60 L 60,108 L 14,60 Z" 
        stroke="url(#jhx-fav-grad)" 
        stroke-width="7" 
        stroke-linejoin="round" 
        fill="none" 
        filter="url(#jhx-fav-glow)"/>

  <!-- 'X' Hunter Blade Reticle -->
  <path d="M 36,36 Q 60,52 84,36 Q 68,60 84,84 Q 60,68 36,84 Q 52,60 36,36 Z" 
        fill="url(#jhx-fav-grad)" 
        filter="url(#jhx-fav-glow)"/>

  <!-- Core White Precision Point -->
  <circle cx="60" cy="60" r="7" fill="#ffffff" filter="url(#jhx-fav-glow)"/>
  <circle cx="60" cy="60" r="3.5" fill="#a855f7"/>
</svg>
