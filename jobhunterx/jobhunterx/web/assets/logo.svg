<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="jhx-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="jhx-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="jhx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Cyber Hexagon Shield -->
  <polygon points="50,8 88,28 88,72 50,92 12,72 12,28" 
           stroke="url(#jhx-grad-1)" 
           stroke-width="3.5" 
           stroke-linecap="round" 
           stroke-linejoin="round"
           filter="url(#jhx-glow)"/>

  <!-- Target Crosshair Sight Rings -->
  <circle cx="50" cy="50" r="28" stroke="url(#jhx-grad-2)" stroke-width="2" stroke-dasharray="8 4" opacity="0.8"/>
  <circle cx="50" cy="50" r="16" stroke="#06b6d4" stroke-width="1.5" opacity="0.9" filter="url(#jhx-glow)"/>

  <!-- Stylized 'X' Hunter Blade Wings -->
  <path d="M 30,30 L 70,70 M 70,30 L 30,70" 
        stroke="url(#jhx-grad-1)" 
        stroke-width="6" 
        stroke-linecap="round" 
        filter="url(#jhx-glow)"/>

  <!-- Central Target Core -->
  <circle cx="50" cy="50" r="5" fill="#ffffff" filter="url(#jhx-glow)"/>
  <circle cx="50" cy="50" r="2.5" fill="#a855f7"/>

  <!-- Precision Tech Nodes -->
  <circle cx="50" cy="14" r="3" fill="#06b6d4" filter="url(#jhx-glow)"/>
  <circle cx="82" cy="32" r="3" fill="#10b981" filter="url(#jhx-glow)"/>
  <circle cx="82" cy="68" r="3" fill="#a855f7" filter="url(#jhx-glow)"/>
  <circle cx="50" cy="86" r="3" fill="#ec4899" filter="url(#jhx-glow)"/>
  <circle cx="18" cy="68" r="3" fill="#3b82f6" filter="url(#jhx-glow)"/>
  <circle cx="18" cy="32" r="3" fill="#8b5cf6" filter="url(#jhx-glow)"/>
</svg>
