# Deploy to the VPS from GitHub's own servers (for networks that block SSH).
#
# Credentials, either:
#   * repository secrets VPS_HOST, VPS_PORT, VPS_USER, VPS_PASSWORD (Settings → Secrets and variables → Actions), or
#   * a sealed one-time hand-over, when nobody can open the secrets page:
#       1. Run with action=keygen. The run makes a key pair, keeps the private key in this repository's Actions cache
#          (not publicly downloadable) and prints the public key.
#       2. Encrypt {"host","port","user","password"} as JSON with that public key (RSA-OAEP, SHA-256) and base64 it:
#          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0
#       3. Run with action=inspect or deploy, sealed=<that base64>, key_run=<the keygen run id>. The private key is
#          deleted from the cache when that run ends, so the sealed text can't be opened again.
#
# inspect — read-only (where the checkout is, its branch, how it runs). deploy — pull, install, restart, check.
# Both run deploy/vps-update.sh on the server. Logs are public: credentials are masked and never printed.

name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      action:
        description: keygen (step 1 of a sealed hand-over), inspect (read-only), logs (read-only, the app's recent errors), deploy, or repair (restart services that are failed)
        type: choice
        options: [inspect, logs, deploy, repair, reboot, keygen, creatoros-inspect, creatoros-diagnose, creatoros-bench, creatoros-frames, creatoros-setenv, creatoros-heygen, creatoros-deploy]
        default: inspect
      sealed:
        description: Sealed credentials (only for the hand-over; leave empty when the VPS_* secrets are set)
        type: string
        default: ""
      key_run:
        description: Run id of the keygen run that made the key for `sealed`
        type: string
        default: ""
      repo_dir:
        description: Path of the checkout on the server (leave empty to find it)
        type: string
        default: ""
      branch:
        description: creatoros-deploy only — the CreatorOS branch to run
        type: string
        default: ""

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  actions: write          # to delete the one-time private key from the cache

jobs:
  keygen:
    name: Make a one-time key
    if: inputs.action == 'keygen'
    runs-on: ubuntu-latest
    steps:
      - name: Key pair (private half stays in the cache, public half printed)
        run: |
          mkdir -p vpskey
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out vpskey/private.pem 2>/dev/null
          echo "Public key for run ${{ github.run_id }}:"
          openssl pkey -in vpskey/private.pem -pubout | base64 -w0; echo
      - uses: actions/cache/save@v4
        with:
          path: vpskey
          key: vps-key-${{ github.run_id }}

  vps:
    name: ${{ inputs.action }} on the VPS
    if: inputs.action != 'keygen'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore the one-time key
        if: inputs.sealed != ''
        uses: actions/cache/restore@v4
        with:
          path: vpskey
          key: vps-key-${{ inputs.key_run }}
          fail-on-cache-miss: true

      - name: Credentials (masked)
        env:
          SEALED: ${{ inputs.sealed }}
          S_HOST: ${{ secrets.VPS_HOST }}
          S_PORT: ${{ secrets.VPS_PORT }}
          S_USER: ${{ secrets.VPS_USER }}
          S_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          if [ -n "$SEALED" ]; then
            json=$(printf '%s' "$SEALED" | base64 -d | openssl pkeyutl -decrypt -inkey vpskey/private.pem \
                     -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256) || { echo "::error::Could not open the sealed credentials"; exit 1; }
            rm -rf vpskey
            get() { printf '%s' "$json" | python3 -c "import sys,json; print(json.load(sys.stdin).get('$1') or '')"; }
            S_HOST=$(get host); S_PORT=$(get port); S_USER=$(get user); S_PASS=$(get password)
            # optional {"env": {"NAME": "value"}}: values for the app's .env
            # (creatoros-setenv). Masked, and only ever sent over ssh stdin.
            ENV_B64=$(printf '%s' "$json" | python3 -c "import sys,json,base64; e=json.load(sys.stdin).get('env') or {}; print(base64.b64encode(json.dumps(e).encode()).decode())")
            printf '%s' "$json" | python3 -c "import sys,json; [print('::add-mask::'+str(v)) for v in (json.load(sys.stdin).get('env') or {}).values() if v]"
            echo "ENV_B64=$ENV_B64" >> "$GITHUB_ENV"; echo "::add-mask::$ENV_B64"
          fi
          [ -n "$S_HOST" ] && [ -n "$S_PASS" ] || { echo "::error::No credentials: set the VPS_* secrets or use a sealed hand-over."; exit 1; }
          for v in "$S_HOST" "$S_PORT" "$S_PASS"; do [ -n "$v" ] && echo "::add-mask::$v"; done
          { echo "VPS_HOST=$S_HOST"; echo "VPS_PORT=${S_PORT:-22}"; echo "VPS_USER=${S_USER:-root}"; echo "SSHPASS=$S_PASS"; } >> "$GITHUB_ENV"
          sudo apt-get install -y -qq sshpass > /dev/null

      - name: Run on the server
        env:
          ACTION: ${{ inputs.action }}
          REPO_DIR: ${{ inputs.repo_dir }}
          BRANCH: ${{ inputs.branch }}
        run: |
          for v in "$ACTION" "$REPO_DIR" "$BRANCH"; do
            [[ "$v" =~ ^[A-Za-z0-9._/-]*$ ]] || { echo "::error::Refusing an input with unsafe characters"; exit 1; }
          done
          SSH=(sshpass -e ssh -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o LogLevel=ERROR "$VPS_USER@$VPS_HOST")
          if [[ "$ACTION" == creatoros-setenv ]]; then
            [ -n "${ENV_B64:-}" ] || { echo "::error::creatoros-setenv needs a sealed {env: {...}}"; exit 1; }
            "${SSH[@]}" "umask 077; cat > /root/.creatoros_setenv.py" < deploy/creatoros-setenv.py
            printf '%s' "$ENV_B64" | "${SSH[@]}" "python3 /root/.creatoros_setenv.py '$REPO_DIR'; rm -f /root/.creatoros_setenv.py"
          elif [[ "$ACTION" == creatoros-* ]]; then
            # CreatorOS on the same server: key NAMES only, never values
            "${SSH[@]}" "bash -s -- '${ACTION#creatoros-}' '$REPO_DIR' '$BRANCH'" < deploy/creatoros-vps.sh
          else
            "${SSH[@]}" "bash -s -- '$ACTION' '$REPO_DIR'" < deploy/vps-update.sh
          fi

      - name: Delete the one-time key
        if: always() && inputs.key_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_RUN: ${{ inputs.key_run }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches?key=vps-key-$KEY_RUN" > /dev/null && echo "one-time key deleted" || true
