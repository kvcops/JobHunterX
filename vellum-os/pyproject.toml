[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vellum-os"
version = "0.1.0"
description = "Career Intelligence & Application Agent — local-first, AI-powered"
requires-python = ">=3.11"
dependencies = [
    # --- Web Framework ---
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",

    # --- Data & Config ---
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "python-dotenv>=1.1.0",
    "langgraph>=1.2.9",

    # --- Search (replaces broken googlesearch-python) ---
    "ddgs>=7.0.0",

    # --- Geospatial ---
    "geopy>=2.4.0",
    "overpy>=0.7.0",

    # --- Scraping & Parsing ---
    "curl-cffi>=0.15.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.13.0",
    "lxml>=5.4.0",
    "scrapegraphai>=1.0.0",

    # --- PDF & Extraction ---
    "xhtml2pdf>=0.2.0",
    "jinja2>=3.1.0",
    "pymupdf>=1.25.0",

    # --- Persistence ---
    "aiosqlite>=0.22.0",

    # --- Resilience & Caching ---
    "tenacity>=9.1.0",
    "diskcache>=5.6.0",

    # --- Observability ---
    "structlog>=26.1.0",

    # --- Email Verification ---
    "dnspython>=2.8.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=4.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vellum*"]
